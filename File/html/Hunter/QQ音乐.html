<div id="ambientBg"></div>
<div id="ambientVeil"></div>
<div id="detailWall" class="detail-wall" aria-hidden="true"><div class="dw-amb" id="detailWallAmb"></div></div>
<div id="grain"></div>

<div id="loginView" class="hidden">
  <div class="login-card" style="position:relative">
    <button type="button" id="loginCloseBtn" aria-label="关闭" style="position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--text-0);font-size:20px;line-height:36px;text-align:center;z-index:2">×</button>
    <div class="login-title">QQ音乐</div>
    <div class="login-sub">千万正版曲库 · 无损音质 · 畅听无限</div>

    <div class="login-pane login-pane-cookie" data-pane="cookie">
      <textarea class="cookie-area" id="cookieInput" placeholder="粘贴 Cookie（含 uin 与 qqmusic_key / qm_keyst）"></textarea>
      <div class="login-actions">
        <button class="login-btn login-btn-primary" id="btnLoginCookie" type="button">登录</button>
        <button class="login-btn login-btn-guest" id="btnGuest" type="button">游客</button>
      </div>
      <div class="login-hint">在浏览器登录 y.qq.com 后，于开发者工具复制 Cookie 粘贴到上方</div>
    </div>
  </div>
</div>


<div id="ckSettingsView" class="hidden">
  <div class="login-card ck-settings-card" style="position:relative;max-height:88vh;overflow:auto;width:min(400px,92vw)">
    <button type="button" id="ckSettingsClose" aria-label="关闭" class="ck-close-x">×</button>
    <div class="ck-head">
      <div class="ck-head-title">设置</div>
      <div class="ck-head-sub">主页音源 · B站登录</div>
    </div>

    <div class="ck-sec">
      <div class="ck-sec-title">主页推荐音源</div>
      <div class="ck-sec-hint">切换后日推 / 歌单 / 榜单跟随平台</div>
      <div class="ck-plat-row" id="ckHomePlatRow">
        <button type="button" class="ck-plat" data-plat="qq">QQ</button>
        <button type="button" class="ck-plat" data-plat="netease">网易</button>
        <button type="button" class="ck-plat" data-plat="kuwo">酷我</button>
      </div>
    </div>

    <div class="ck-sec">
      <div class="ck-sec-title">取流音源开关</div>
      <div class="ck-sec-hint">切换上方站源，开关对应取流镜像 · 每站至少留一个</div>
      <div class="ck-src-list" id="ckMirrorEnableList"></div>
    </div>

    <div class="ck-sec">
      <div class="ck-sec-title">B站 SESSDATA <span class="ck-badge" id="biliCkBadge">未填</span></div>
      <div class="ck-sec-hint" id="biliCkStatusHint">可选 · 提升音质</div>
      <textarea class="cookie-area ck-area-sm" id="biliSessInput" placeholder="粘贴 SESSDATA 或完整 Cookie" style="color:inherit"></textarea>
      <div class="ck-btn-row">
        <button type="button" class="ck-btn ck-btn-main" id="biliSessSave">保存</button>
        <button type="button" class="ck-btn ck-btn-ghost" id="biliCkClear">清除</button>
      </div>
    </div>

    <div class="ck-foot">仅存本机 · QQ 登录在「我的」</div>
  </div>
</div>

    <nav id="mainNav">

  <div id="viewport">

  <div id="playerBar">

      <div class="pb-meta-info" id="pbMetaInfo">
        <div class="pb-title" id="pbTitle">未播放</div>
        <div class="pb-artist" id="pbArtist">选择一首歌曲开始</div>
      </div>
      <div class="pb-lyric" id="pbLyric" aria-live="polite"></div>
    </div>
    <button type="button" class="pb-play" id="pbPlay" aria-label="播放/暂停"><svg><use href="#i-play"/></svg></button>
    <button type="button" class="pb-ctrl-btn pb-list-btn" id="pbListBtn" aria-label="下一首，长按打开播放列表" title="下一首（长按播放列表）"><svg><use href="#i-next"/></svg></button>

    <button class="pb-like" id="pbLike" hidden><svg><use href="#i-heart"/></svg></button>

<div id="fullPlayer">
  <div id="fpBg">
    <div class="fp-bg-amb" id="fpBgAmb" aria-hidden="true"></div>
    <div class="fp-bg-veil" aria-hidden="true"></div>
  </div>
  <div id="fpOrbs" aria-hidden="true"><div class="fp-orb"></div><div class="fp-orb"></div><div class="fp-orb"></div></div>
  <div class="fp-topbar">
    <button class="fp-close" id="fpClose" type="button"><svg><use href="#i-chevdown"/></svg></button>
    <div class="fp-track-info"><div class="fp-track-name" id="fpTitle">未播放</div><div class="fp-track-artist" id="fpArtist">—</div></div>
    <div class="fp-top-spacer" aria-hidden="true"></div>
  </div>
  <div class="fp-left">
    <div class="fp-art is-paused" id="fpArt" data-style="vinyl" title="点击切换封面样式">
      <div class="fp-art-stage">
        <div class="fp-spectrum-glow" id="fpSpectrumGlow"></div>
        <div class="fp-spectrum" id="fpSpectrum"></div>
        <div class="fp-pulse-ring"></div>
        <div class="fp-pulse-ring r2"></div>
        <div class="fp-ring-spin"></div>
        <div class="fp-portal" id="fpPortal" aria-hidden="true">
          <i class="p1"></i><i class="p2"></i><i class="p3"></i>
          <span class="p-core"></span>
        </div>
        <div class="fp-orbit" id="fpOrbit" aria-hidden="true">
          <i class="o1"></i><i class="o2"></i><i class="o3"></i>
          <span class="o-dot d1"></span><span class="o-dot d2"></span>
        </div>
        <div class="fp-holo" id="fpHolo" aria-hidden="true">
          <span class="h-scan"></span>
          <span class="h-ring"></span>
        </div>
        <div class="fp-vinyl" id="fpVinyl">
          <div class="fp-groove"></div>
          <img id="fpCoverImg" alt="" class="img-err">
        </div>
        <div class="fp-wave" id="fpWave"></div>
      </div>
    </div>
  </div>
  <div class="fp-right">
    <!-- 文字 Tab 已移除：用底部列表图标切换歌词 / 播放列表；保留隐藏标记供状态同步 -->
    <div class="fp-tabs" aria-hidden="true" hidden>
      <div class="fp-tab active" data-tab="lyrics">歌词</div>
      <div class="fp-tab" data-tab="playlist">播放列表</div>
    </div>
    <div id="lyricsWrap"><div class="song-list" id="lyricsList"></div></div>
    <div id="playlistPanel" style="display:none"></div>
  </div>
  <div class="fp-dock">
    <div class="fp-brush-meta" id="fpBrushMeta" aria-hidden="true">
      <div class="bm-title" id="fpBrushTitle">未播放</div>
      <div class="bm-artist" id="fpBrushArtist">—</div>
    </div>
    <div class="fp-controls">
      <div class="fp-ctrls">
        <button class="fp-ctrl-btn" id="fpSrcBtn" type="button" title="切换音源" aria-label="切换备用音源"><svg><use href="#i-source"/></svg></button>
        <button class="fp-ctrl-btn" id="fpPrev" type="button"><svg><use href="#i-prev"/></svg></button>
        <button class="fp-play" id="fpPlay" type="button"><svg><use href="#i-play"/></svg></button>
        <button class="fp-ctrl-btn" id="fpNext" type="button"><svg><use href="#i-next"/></svg></button>
        <button class="fp-ctrl-btn" id="fpLrcBtn" type="button" title="切换歌词源" aria-label="切换其他平台歌词"><svg><use href="#i-lyric"/></svg></button>
      </div>
      <div class="fp-progress">
        <span class="fp-time" id="fpCur">00:00</span>
        <div class="fp-bar" id="fpBar"><div class="fp-bar-fill" id="fpBarFill"></div><div class="fp-bar-knob" id="fpBarKnob"></div></div>
        <span class="fp-time right" id="fpDur">00:00</span>
      </div>
    </div>
    <div class="fp-quick">
      <button id="fpLike" type="button"><svg><use href="#i-heart"/></svg></button>
      <button id="fpSpeed" type="button" class="fp-speed-btn" title="播放倍速 1.0x" aria-label="播放倍速"><svg><use href="#i-speed"/></svg></button>
      <button id="fpQuality" type="button" class="fp-quality-btn" title="切换音质" aria-label="切换音质"><svg><use href="#i-quality"/></svg></button>
      <button id="fpModeBtn" type="button" title="顺序播放"><svg><use href="#i-repeat"/></svg></button>
      <button id="fpListBtn" type="button" class="fp-list-btn" title="播放列表" aria-label="切换歌词/播放列表"><svg><use href="#i-list"/></svg></button>
    </div>
    <div class="fp-brush-hint" id="fpBrushHint" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 14l5 5 5-5H7zm0-4l5-5 5 5H7z"/></svg>
      <span>上下滑动切歌</span>
    </div>
  </div>
</div>

<div id="mvPlayerView">
  <div class="mv-drag-hint" aria-hidden="true"></div>
  <div class="mv-top-bar"><button class="fp-close" id="mvClose"><svg><use href="#i-chevdown"/></svg></button><div id="mvTopTitle" style="font-size:14px;font-weight:600"></div></div>
  <video id="mvVideo" controls playsinline></video>
</div>

<div class="sheet-mask" id="sheetMask"></div>
<div id="toast"></div>
<audio id="audioEl" preload="auto" playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false" x-webkit-airplay="allow"></audio>
<audio id="audioNextEl" preload="auto" playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"></audio>
<script src="app.js"></script>
<script src="squid-spin.js"></script>
<script src="molan-lx-bridge.js"></script>
<script src="molan-source.js"></script>
<script src="molan-page-patch.js"></script>
</body>
</html>
